[package]
name = "handy-chatgpt-cleanup-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3.6", features = ["apple-native", "sync-secret-service", "crypto-rust", "vendored"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_Foundation"] }
