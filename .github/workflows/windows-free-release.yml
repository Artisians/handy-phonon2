name: Build Handy Phonon Windows (public, no paid storage)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "index.html"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "eslint.config.js"
      - "docs/FORK_NOTICE.md"
      - ".github/workflows/windows-free-release.yml"
  workflow_dispatch:
    inputs:
      sdk_license_accepted:
        description: "Approve Vulkan SDK 1.4.309.0 licenses linked in docs/WINDOWS_RELEASE.md"
        required: true
        type: boolean
        default: false
      publish_release:
        description: "Publish the verified installer and portable ZIP as a public prerelease"
        required: true
        type: boolean
        default: false

# Main-branch source pushes build the approved release series; no PR/release/schedule
# triggers. No caches, Actions artifacts, or models. SDK approval is exactly pinned.
permissions:
  contents: read

concurrency:
  group: handy-phonon-windows-release
  cancel-in-progress: true

jobs:
  release:
    # Job-level guard prevents allocating a billable private-repository runner.
    if: >-
      github.repository == 'Artisians/handy-phonon2' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2022
    timeout-minutes: 120
    # One job builds and delivers directly to Releases: no artifact transfer.
    # Only this release job has write access. No custom PAT or OIDC grant.
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: C:\hp-target
      VCPKG_BINARY_SOURCES: clear
      SDK_LICENSE_ACCEPTED: ${{ inputs.sdk_license_accepted }}
      HANDY_DISABLE_UPDATER: "1"
      CI: "true"

    steps:
      - name: Checkout exact dispatched commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Set up Node (no dependency cache)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Verify fork isolation and prepare official toolchains
        timeout-minutes: 25
        run: ./scripts/ci/prepare-windows.ps1

      - name: Install locked JavaScript dependencies
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }

      - name: Frontend checks and model-free adapter tests
        timeout-minutes: 20
        run: |
          bun run lint
          if ($LASTEXITCODE -ne 0) { throw 'Frontend lint failed' }
          bun run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          bun tests/phonon-ui.test.tsx
          if ($LASTEXITCODE -ne 0) { throw 'Phonon UI tests failed' }
          npm run test:chatgpt-ui
          if ($LASTEXITCODE -ne 0) { throw 'ChatGPT UI mock tests failed' }
          cargo test --locked --manifest-path tests/phonon-adapter/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Phonon mock-server tests failed' }
          cargo test --locked --manifest-path tests/chatgpt-cleanup/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'ChatGPT mock tests failed' }

      - name: Build unsigned Windows x64 installer
        timeout-minutes: 75
        run: |
          bun run tauri build --no-sign --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }

      - name: Verify installer payload and create portable ZIP and hashes
        timeout-minutes: 8
        run: ./scripts/ci/package-windows.ps1

      - name: Publish complete verified prerelease
        if: github.event_name == 'push' || inputs.publish_release
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/publish-windows.ps1

      - name: Record delivery mode
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'push' -and '${{ inputs.publish_release }}' -ne 'true') {
            'Build and smoke checks passed. Publishing was disabled: files exist only on this temporary runner and were not uploaded.' >> $env:GITHUB_STEP_SUMMARY
          }
